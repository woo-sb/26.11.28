  const c = main; c.imageSmoothingQuality = 'high'; c.globalAlpha = 1;
  const hid = focus * 1.3 >= 1;
  if (!hid) scene(c, D, now, dt);
  if (focus > 0 && !(playing && ++skip % 5)) {
    scene(bx, .2, now, 0); tx.setTransform(1, 0, 0, 1, 0, 0); tx.globalAlpha = 1; tx.drawImage(blurC, 0, 0, tiny.width, tiny.height);
    bx.setTransform(1, 0, 0, 1, 0, 0); bx.globalAlpha = 1; bx.drawImage(tiny, 0, 0, blurC.width, blurC.height);
    for (const [x, y, a] of [[3, 0, .5], [-3, 0, .33], [0, 3, .25], [0, -3, .2]]) { bx.globalAlpha = a; bx.drawImage(tiny, x, y, blurC.width, blurC.height); }
  }
  if (focus > 0) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = Math.min(1, focus * 1.3); c.drawImage(blurC, 0, 0, cv.width, cv.height); c.globalAlpha = 1;
  }
  if (dusk > 0) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply'; c.globalAlpha = dusk; c.fillStyle = '#6f7fb4'; c.fillRect(0, 0, cv.width, cv.height); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
  view(c, D);
  const lit = flame.filter(f => f.lit).length;
  if (dusk > 0 && lit) {
    const x = P.x + CX * P.k, y = P.y + (CY - 225) * P.k, r = 250 + Math.sin(now / 140) * 6, g = c.createRadialGradient(x, y, 5, x, y, r);
    g.addColorStop(0, 'rgba(255,200,110,.8)'); g.addColorStop(.4, 'rgba(255,190,110,.32)'); g.addColorStop(1, 'rgba(255,190,110,0)');
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = dusk * lit / 2; c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
  drawCake(c, now);
  for (const b of bits) { b.t += dt; if (b.drag) { b.vx *= 1 - b.drag * dt; b.vy *= 1 - b.drag * dt; } b.x += b.vx * dt; b.y += b.vy * dt; const u = b.t / b.max; spr(c, b.n, b.x, b.y, b.s * (b.n === 'puff' ? .5 + out(Math.min(1, u)) * .8 : Math.sin(Math.min(1, u) * PI) * 1.1), undefined, (b.spin || 0) * b.t, b.n === 'puff' ? 1 - u : 1); }
  bits = bits.filter(b => b.t < b.max);
  if (jj.a > 0) spr(c, 'jjan', rk.x + 10, rk.y - 775, jj.s, jj.s, 0, jj.a);
  drawSnow(c, D, 1, now, dt);
  drawSnow(c, D, 2, now, dt);
  view(c, D);
  if (end[0] > 0) {
    /* 머리 위 빈 곳 가운데 */
    const top = cam.y - H / 2 / (S * cam.k), head = P.y - 590 * P.k * 1.63, my = (top + head) / 2, fit = Math.min(1, (head - top) / 520), bob = Math.sin(now / 1100) * 5;
    [['end1', 0, -105], ['end2', 0, 58], ['end3', 250, 158]].forEach(([n, x, y], i) => { if (end[i] > 0) spr(c, n, P.x + x * fit, my + y * fit + bob + (1 - out(end[i])) * 26, fit * (i === 1 ? mix(.6, 1, back(end[i])) : 1), undefined, 0, Math.min(1, end[i] * 2)); });
  }
  if (flash > 0) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = flash; c.fillStyle = '#fffbe9'; c.fillRect(0, 0, cv.width, cv.height); c.globalAlpha = 1; }
  requestAnimationFrame(frame);
}
(function blink() { setTimeout(() => { rk.blink = true; setTimeout(() => { rk.blink = false; blink(); }, 130); }, rnd(1800, 3600)); })();

/* 폴짝 뛰기: 웅크림 → 늘어나며 뜀 → 착지하며 눌림 */
async function hop(to, h, ms, side = 0, land = 1) {
  const f = { x: rk.x, y: rk.y, k: rk.k };
  await tween(110, t => { rk.sy = 1 - .1 * out(t); rk.sx = 1 + .08 * out(t); });
  kick(-160);
  await tween(ms, t => {
    rk.x = mix(f.x, to.x, t); rk.y = mix(f.y, to.y, t); rk.k = mix(f.k, to.k, t); rk.lift = 4 * h * t * (1 - t);
    const st = Math.cos(t * PI); rk.sy = 1 + .1 * Math.abs(st) * (t < .95 ? 1 : 0); rk.sx = 1 - .07 * Math.abs(st); rk.rot = side * Math.sin(t * PI) * .09;
    rk.fl = side >= 0 ? Math.sin(t * PI) * 22 : 0; rk.fr = side <= 0 ? Math.sin(t * PI) * 22 : 0;
    to.mid && t > .5 && to.mid();
  });
  rk.lift = rk.fl = rk.fr = rk.rot = 0; kick(330 * land); puffs(4);
  prints.push({ x: rk.x - 95 * rk.k, y: rk.y, r: 58 * rk.k }, { x: rk.x + 95 * rk.k, y: rk.y, r: 58 * rk.k });
  tween(300, t => { const q = Math.sin(t * PI * 1.5) * (1 - t); rk.sy = 1 - .16 * land * q - .1 * (1 - t) * land; rk.sx = 1 + .13 * land * q + .08 * (1 - t) * land; if (t === 1) rk.sx = rk.sy = 1; });
}

/* 뒤뚱뒤뚱 걷기: 눈 속 멀리서 앞으로 걸어 나옴 */
async function walk(ms) {
  const N = 12; let seen = 0; rk.on = true;
  await tween(ms, t => {
    const e = t * (.6 + .4 * t), ph = t * N, q = ph % 1, side = Math.floor(ph) % 2 ? 1 : -1, sw = Math.sin(q * PI);
    rk.k = mix(.2, P.k, e); rk.x = P.x + Math.sin(t * PI * 2) * 46 * (1 - t); rk.y = mix(-72, P.y, e); rk.a = Math.min(1, t * 6);
    rk.lift = sw * 34 * rk.k; rk.rot = side * sw * .06; rk.fl = side < 0 ? sw * 22 : 0; rk.fr = side > 0 ? sw * 22 : 0;
    const sq = Math.max(0, 1 - Math.min(q, 1 - q) * 6); rk.sy = 1 - sq * .045; rk.sx = 1 + sq * .035;
    const n = Math.floor(ph); if (n > seen) { seen = n; kick(110); if (n < N) prints.push({ x: rk.x + side * 95 * rk.k, y: rk.y, r: 56 * rk.k }); if (n > 3) puffs(2); }
  });
  Object.assign(rk, { x: P.x, y: P.y, k: P.k, a: 1, lift: 0, rot: 0, fl: 0, fr: 0, sx: 1, sy: 1 });
}

/* 이야기 */
let playing = false;
async function play() {
  for (const e of ['again', 'mic', 'hint', 'c0', 'c1']) $(e).hidden = true;
  rk = fresh(); bits = []; prints = []; focus = dusk = rays = flash = 0; jj.a = 0; end = [0, 0, 0]; flame.forEach(f => f.lit = true);
  cam = { x: 0, y: -620, k: 1 };
  await wait(500);
  moveCam(REST, 3000);
  await wait(900);
  await walk(4600);
  await wait(650);
  /* 짠! */
  await tween(340, t => { rk.sy = 1 - .13 * out(t); rk.sx = 1 + .09 * out(t); rk.up = -24 * out(t); });
  kick(-260); moveCam({ x: 0, y: -290, k: 1.08 }, 420, back);
  stars(rk.x, rk.y - 330, 16, 900); 
  tween(260, t => { jj.a = Math.min(1, t * 3); jj.s = back(t); rays = .5 * t; });
  await tween(420, t => { rk.lift = 4 * 90 * t * (1 - t); rk.sy = 1 + .12 * Math.sin(t * PI); rk.sx = 1 - .08 * Math.sin(t * PI); rk.up = mix(-24, 46, back(Math.min(1, t * 1.6))); });
  rk.lift = 0; rk.sx = rk.sy = 1; kick(240); puffs(6);
  await wait(1500);
  tween(420, t => { jj.a = 1 - t; rays = .5 * (1 - t); rk.up = 46 * (1 - inOut(t)); });
  await wait(300);
  await moveCam(cakeCam(), 2500, inOut, (t, e) => { focus = Math.max(0, (e - .15) / .85); dusk = .5 * e; });
  playing = true; placeCandles(); $('c0').hidden = $('c1').hidden = $('mic').hidden = $('hint').hidden = false; $('hint').textContent = '초를 눌러서 꺼 주세요';
}
const cakeCam = () => ({ x: P.x + CX * P.k, y: P.y + (CY - 88 * CK) * P.k, k: 3.55 });
function placeCandles() {
  if (!playing) return;
  Object.assign(cam, cakeCam());
  const u = P.k * CK;
  [0, 1].forEach(i => {
    const [x, y] = toScreen(P.x + (CX + (WX[i] - 30) * CK) * P.k, P.y + (CY - 252 * CK) * P.k), m = u * S * cam.k;
    Object.assign($('c' + i).style, { left: x + 'px', top: y + 'px', width: 60 * m + 'px', height: 128 * m + 'px' });
  });
}
function blowOut(i) {
  if (!playing || !flame[i].lit) return;
  flame[i] = { lit: false, t: performance.now() }; $('c' + i).hidden = true; sp.cr.v += .25;
  if (!flame.some(f => f.lit)) finish();
}
async function finish() {
  playing = false; stopMic(); $('mic').hidden = $('hint').hidden = true;
  await tween(500, t => dusk = mix(.5, .85, t)); await wait(900);
  rk.happy = true;
  const x = P.x + CX * P.k, y = P.y + (CY - 170) * P.k;
  tween(700, t => flash = .3 * (1 - t));
  stars(x, y, 14, 520, 130);
  moveCam(REST, 1700, t => out(t), (t, e) => { focus = Math.max(0, 1 - e * 1.5); dusk = Math.max(0, 1 - e * 1.4); rays = .4 * e; });
  await wait(900);
  for (let i = 0; i < 3; i++) { tween(330, t => rk.up = 40 * Math.sin(t * PI)); await hop(P, 85, 330, i % 2 ? 1 : -1); stars(rk.x, rk.y - 330, 8, 700); await wait(120); }
  tween(1500, t => rays = mix(.4, .15, t));
  await wait(500);
  for (let i = 0; i < 3; i++) { await tween(620, t => end[i] = t); await wait(220); }
  await wait(1200); $('again').hidden = false;
}
$('again').onclick = play;

/* 초 끄기 1: 누르기, 쓸기, 키보드 */
let down = false;
const at = e => { const el = document.elementFromPoint(e.clientX, e.clientY); if (el?.classList.contains('candle')) blowOut(+el.id[1]); };
addEventListener('pointerdown', e => { down = true; if (e.target.hasPointerCapture?.(e.pointerId)) e.target.releasePointerCapture(e.pointerId); at(e); });
addEventListener('pointermove', e => { if (down) at(e); });
for (const n of ['pointerup', 'pointercancel']) addEventListener(n, () => down = false);
[0, 1].forEach(i => $('c' + i).onclick = () => blowOut(i));

/* 초 끄기 2: 마이크에 불기. 소리는 이 화면에서만 쓰고 저장하거나 보내지 않음 */
let mic = null;
function stopMic() { if (!mic) return; mic.on = false; mic.stream?.getTracks().forEach(t => t.stop()); mic.ctx?.close().catch(() => {}); mic = null; }
$('mic').onclick = async () => {
  if (mic) return;
  const m = mic = { on: true };
  try {
    m.ctx = new (window.AudioContext || window.webkitAudioContext)(); m.ctx.resume();
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (!m.on) return s.getTracks().forEach(t => t.stop());
    m.stream = s;
  } catch { m.ctx?.close().catch(() => {}); mic = null; $('mic').hidden = true; if (playing) $('hint').textContent = '마이크를 쓸 수 없어요. 초를 눌러서 꺼 주세요'; return; }
  $('mic').hidden = true; $('hint').textContent = '듣고 있어요. 폰에 대고 후~';
  const an = m.ctx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .3; m.ctx.createMediaStreamSource(m.stream).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount), low = Math.max(4, Math.round(500 / (m.ctx.sampleRate / 1024)));
  let base = null, n = 0, held = 0, prev = performance.now();
  (function listen(now) {
    if (!m.on) return;
    const dt = Math.max(0, now - prev); prev = now;
    an.getByteFrequencyData(buf);
    let v = 0; for (let i = 1; i <= low; i++) v += buf[i]; v /= low;
    if (n < 24) { base = base === null ? v : base + (v - base) / 8; n++; }
    else if (v > Math.max(95, Math.min(base + 35, 190))) { held += dt; if (held > 380) { held = 0; const i = flame.findIndex(f => f.lit); if (i >= 0) blowOut(i); } }
    else held = Math.max(0, held - dt * 3);
    requestAnimationFrame(listen);
  })(prev);
};
addEventListener('pagehide', stopMic);

rk = fresh(); resize(); addEventListener('resize', resize);
Promise.all(Object.values(ART).map(a => { a.i = new Image(); a.i.src = a.d; return a.i.decode(); })).then(() => { requestAnimationFrame(frame); play(); });
</script>
